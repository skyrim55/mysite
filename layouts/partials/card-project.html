<article class="card card-project" data-reveal>
  <a class="card-hit" href="{{ .RelPermalink }}" aria-label="{{ .Title }}">
    <div class="card-media">
      <img src="{{ .Params.cover }}" alt="{{ .Title }}" loading="lazy">
      <span class="card-badge badge-status-{{ .Params.status | lower }}">{{ .Params.status | title }}</span>
    </div>
    <div class="card-body">
      <h3 class="card-title">{{ .Title }}</h3>
      <p class="card-desc">{{ .Params.summary }}</p>
      <ul class="tag-row">
        {{ range .Params.tags }}<li class="tag">{{ . }}</li>{{ end }}
      </ul>
    </div>
  </a>
</article>
