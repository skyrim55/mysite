<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  {{ partial "header.html" . }}

  <main id="content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  {{ block "scripts" . }}{{ end }}
  <script src="{{ (resources.Get "js/main.min.js" | fingerprint).RelPermalink }}" defer></script>
</body>
</html>
